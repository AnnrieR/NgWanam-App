# Official Supabase self-hosted/v0.8.3, commit pinned in UPSTREAM.lock.json.
# Infrastructure ONLY. No web app, published host ports, or fixed container names.
# Use a unique Dokploy Compose project per instance; never change it casually.
x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true
  networks:
    - backend

services:
  db:
    <<: *common
    image: ${INSTANCE_ID:?Set INSTANCE_ID}-supabase-db:17.6.1.136-config-v1
    build:
      context: .
      dockerfile: images/db.Dockerfile
    pull_policy: build
    shm_size: 256mb
    mem_limit: 3g
    cpus: 1.0
    pids_limit: 256
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD:?Generate a private env file first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private env file first}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - max_connections=100
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
    volumes:
      - pg-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
      # Official platform SQL is baked into the derived image, not checkout mounts.
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  auth:
    <<: *common
    image: supabase/gotrue:v2.197.0
    mem_limit: 384m
    cpus: 0.35
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://${API_DOMAIN:?Set the API domain}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:?Set the public website URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:?Set exact Auth redirect URLs}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Set the unique JWT secret}
      GOTRUE_JWT_ISSUER: https://${API_DOMAIN:?Set API_DOMAIN}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      # Enable Google only AFTER applying the app's Google identity-guard migration.
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${API_DOMAIN:?Set API_DOMAIN}/auth/v1/callback
      GOTRUE_SECURITY_MANUAL_LINKING_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_PASSWORD_MIN_LENGTH: "8"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-NgWanam}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://localhost:9999/health]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rest:
    <<: *common
    image: postgrest/postgrest:v14.18
    mem_limit: 256m
    cpus: 0.35
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_POOL: "10"
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: "3001"
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: [postgrest]
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  realtime:
    <<: *common
    image: supabase/realtime:v2.143.3
    # Official tenant hostname, scoped to this project's backend network only.
    hostname: realtime-dev.supabase-realtime
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 256
    depends_on:
      db:
        condition: service_healthy
    networks:
      backend:
        aliases:
          - realtime-dev.supabase-realtime
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:?Set the 16-character Realtime encryption key}
      API_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ANON_KEY: ${ANON_KEY:?Set ANON_KEY}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set the internal encryption secret}
      METRICS_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      ERL_FLAGS: +S 2:2
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"
    healthcheck:
      test: [CMD-SHELL, 'curl -sSfL --head -o /dev/null -H "Authorization: Bearer $$ANON_KEY" http://localhost:4000/api/tenants/realtime-dev/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  storage:
    <<: *common
    image: supabase/storage-api:v1.81.0
    mem_limit: 512m
    cpus: 0.35
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY:?Set the generated anon JWT}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set the generated service-role JWT}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: https://${API_DOMAIN:?Set API_DOMAIN}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: "1048575"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      GLOBAL_S3_BUCKET: stub
      TENANT_ID: ngwanam
      REGION: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
      S3_PROTOCOL_ENABLED: "false"
      DATABASE_MAX_CONNECTIONS: "10"
    volumes:
      - storage-data:/var/lib/storage
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:5000/status]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  meta:
    <<: *common
    image: supabase/postgres-meta:v0.100.0
    mem_limit: 256m
    cpus: 0.2
    pids_limit: 128
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Set the Studio metadata encryption key}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  studio:
    <<: *common
    image: supabase/studio:2026.10.12-sha-3699278
    mem_limit: 768m
    cpus: 0.35
    pids_limit: 256
    depends_on:
      meta:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY:?Set PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-NgWanam}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-NgWanam Production}
      OPENAI_API_KEY: ""
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: https://${API_DOMAIN:?Set API_DOMAIN}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Set ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ENABLED_FEATURES_LOGS_ALL: "false"
      SNIPPETS_MANAGEMENT_FOLDER: /app/snippets
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: /app/edge-functions
    volumes:
      - studio-snippets:/app/snippets
      - studio-functions:/app/edge-functions:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:3000/api/platform/profile').then(r=>{if(r.status!==200)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  api-gw:
    <<: *common
    image: ${INSTANCE_ID:?Set INSTANCE_ID}-supabase-gateway:v1.39.1-config-v1
    build:
      context: .
      dockerfile: images/gateway.Dockerfile
    pull_policy: build
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    depends_on:
      studio:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
      storage:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks:
      - backend
      - proxy
    environment:
      ANON_KEY: ${ANON_KEY:?Set ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Set SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
      SUPABASE_PUBLIC_URL: https://${API_DOMAIN:?Set API_DOMAIN}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:?Set the Studio username}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set a strong Studio password}
    entrypoint: [/bin/sh, /docker-entrypoint.sh]
    command: [--concurrency, "2"]
    healthcheck:
      test: [CMD-SHELL, "timeout 1 bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.services.${INSTANCE_ID:?Set a unique instance ID}-api.loadbalancer.server.port=8000"
      # API host exposes SDK routes only, NOT Studio or postgres-meta routes.
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-api.rule=Host(`${API_DOMAIN:?Set API_DOMAIN}`) && (PathPrefix(`/auth/v1/`) || PathPrefix(`/rest/v1/`) || PathPrefix(`/storage/v1/`) || PathPrefix(`/realtime/v1/`))"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-api.service=${INSTANCE_ID:?Set INSTANCE_ID}-api"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-api.tls=true"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      # Studio domain -> same gateway, preserving upstream Basic Auth, PLUS IP allowlist.
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-studio.rule=Host(`${STUDIO_DOMAIN:?Set STUDIO_DOMAIN}`)"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-studio.service=${INSTANCE_ID:?Set INSTANCE_ID}-api"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-studio.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-studio.tls=true"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-studio.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${INSTANCE_ID:?Set INSTANCE_ID}-studio.middlewares=${INSTANCE_ID:?Set INSTANCE_ID}-studio-ip"
      - "traefik.http.middlewares.${INSTANCE_ID:?Set INSTANCE_ID}-studio-ip.ipallowlist.sourcerange=${STUDIO_ALLOWED_CIDRS:?Set your admin IP or VPN CIDRs}"

networks:
  backend: {}
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-dokploy-network}

# No explicit names or external volumes: Docker namespaces these by Compose project.
volumes:
  pg-data: {}
  db-config: {}
  storage-data: {}
  studio-snippets: {}
  studio-functions: {}
